name: 데이터 업데이트 및 배포

on:
  schedule:
    - cron: '7 * * * *'   # 매시간 7분 (UTC 기준, 한국 시간도 매시간)
  workflow_dispatch:       # Actions 탭에서 수동 실행
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 날짜 계산 (실거래가는 하루 한 번만 새로 받기)
        id: date
        run: echo "d=$(TZ=Asia/Seoul date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 실거래가 캐시
        uses: actions/cache@v4
        with:
          path: |
            .cache/*.json
          key: cache-${{ steps.date.outputs.d }}-${{ github.run_id }}
          restore-keys: |
            cache-${{ steps.date.outputs.d }}-

      - name: 사진 캐시 (한 번 받은 사진은 다시 받지 않기)
        uses: actions/cache@v4
        with:
          path: .cache/thumbs
          key: thumbs-${{ github.run_id }}
          restore-keys: |
            thumbs-

      - name: 큰 사진 주소 캐시 (물건마다 한 번만 상세 조회)
        uses: actions/cache@v4
        with:
          path: .cache/detail
          key: detail-${{ github.run_id }}
          restore-keys: |
            detail-

      - name: 사이트 만들기
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          ONBID_GOODS_URL: ${{ vars.ONBID_GOODS_URL }}
          ONBID_CAR_URL: ${{ vars.ONBID_CAR_URL }}
          ONBID_RANK_URL: ${{ vars.ONBID_RANK_URL }}
          ONBID_RESULT_URL: ${{ vars.ONBID_RESULT_URL }}
          ONBID_RESULT_PRICE_FIELD: ${{ vars.ONBID_RESULT_PRICE_FIELD }}
          ONBID_RLST_DTL_URL: ${{ vars.ONBID_RLST_DTL_URL }}
          ONBID_GOODS_DTL_URL: ${{ vars.ONBID_GOODS_DTL_URL }}
          ONBID_CAR_DTL_URL: ${{ vars.ONBID_CAR_DTL_URL }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
          node scripts/build.mjs

      - name: 공유 카드 캐시
        uses: actions/cache@v4
        with:
          path: |
            .cache/og
            .cache/fonts
          key: og-${{ github.run_id }}
          restore-keys: |
            og-

      - name: 카톡 공유 카드 만들기
        run: |
          mkdir -p .cache/fonts
          for w in Bold Medium; do
            f=".cache/fonts/Pretendard-$w.otf"
            [ -s "$f" ] || curl -fsSL -o "$f" "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/public/static/Pretendard-$w.otf" || rm -f "$f"
          done
          if [ ! -s .cache/fonts/Pretendard-Bold.otf ]; then sudo apt-get install -y -qq fonts-noto-cjk >/dev/null; fi
          python3 -c "import PIL" 2>/dev/null || pip install -q pillow
          OG_FONT_BOLD=.cache/fonts/Pretendard-Bold.otf OG_FONT_REG=.cache/fonts/Pretendard-Medium.otf python3 scripts/og.py

      - name: 점검용 사본 (커밋 메시지에 [snapshot]이 있을 때만 snapshot 브랜치에 올림)
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[snapshot]')
        run: |
          cd dist
          git init -q -b snapshot
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -q -m "snapshot ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" snapshot
          rm -rf .git

      - name: Cloudflare Pages 프로젝트 준비 (처음 한 번만 만들어져요)
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create ${{ vars.CF_PROJECT || 'auction-radar' }} --production-branch=main

      - name: Cloudflare Pages에 배포
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PROJECT || 'auction-radar' }} --branch=main --commit-dirty=true
